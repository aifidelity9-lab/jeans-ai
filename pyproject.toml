[project]
name = "jeans-ai"
version = "0.1.0"
description = "AI-powered jeans e-commerce: auto try-on, video generation, multi-platform publishing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "pillow>=11.0",
    "boto3>=1.36",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
ai = [
    "torch>=2.5",
    "torchvision>=0.20",
    "diffusers>=0.32",
    "transformers>=4.48",
    "accelerate>=1.3",
]
video = [
    "moviepy>=2.1",
]
raw = [
    "rawpy>=0.21",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
